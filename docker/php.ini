; Configuracion de PHP para el servidor.
;
; La imagen oficial de PHP no trae php.ini, asi que sin este archivo quedan los
; valores minimos de fabrica: 128 MB de memoria, 2 MB de subida y 30 segundos
; de ejecucion. Con eso no se arma un PDF ni se sube un archivo de Excel.

; dompdf arma la hoja entera en memoria, con el escudo del membrete adentro.
; La instancia tiene 512 MB en total, asi que se deja margen para el resto.
memory_limit = 384M

; Los libros de Excel de las unidades pesan varios megas.
upload_max_filesize = 32M
post_max_size = 32M

; Una importacion de cientos de bienes tarda mas de medio minuto.
max_execution_time = 180
max_input_time = 180

; En el servidor los errores van al registro, no a la pantalla del usuario.
display_errors = Off
log_errors = On
error_log = /dev/stderr

; Compilar una sola vez: el codigo no cambia entre visita y visita.
opcache.enable = 1
opcache.memory_consumption = 64
opcache.validate_timestamps = 0

date.timezone = America/Guatemala
